{% extends 'base/base.html' %}
{% load static %}

{% block full_page %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">VIBE</div>
    <p class="auth-tagline">Welcome back! Pick up where you left off ✨</p>

    <!-- Django Messages -->
    {% if messages %}
      {% for message in messages %}
        <div style="background:rgba(236,72,153,.15);border:1px solid rgba(236,72,153,.3);border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem;font-size:.85rem;color:#fff;display:flex;align-items:center;gap:.5rem;">
          ⚠️ {{ message }}
        </div>
      {% endfor %}
    {% endif %}


    <!-- Login Form -->
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" name="username" class="vibe-input" placeholder="Enter username or email" 
               autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <input type="password" name="password" class="vibe-input" placeholder="Your password"
                 id="password-field" autocomplete="current-password" required>
          <button type="button" onclick="togglePw()" 
                  style="position:absolute;right:.875rem;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.5);cursor:pointer;font-size:.9rem;">
            <i class="fas fa-eye" id="pw-eye"></i>
          </button>
        </div>
      </div>

      <div style="display:flex;justify-content:flex-end;margin-bottom:1.25rem;">
        <a href="#" style="font-size:.82rem;color:rgba(255,255,255,.7);text-decoration:none;">Forgot password?</a>
      </div>

      <button type="submit" class="btn-vibe btn-primary btn-block btn-lg">
        Login to VIBE 🚀
      </button>
    </form>

    <div class="auth-switch">
      New to VIBE? <a href="{% url 'signup' %}">Create an account</a>
    </div>
  </div>
</div>
<script>
function togglePw() {
  const f = document.getElementById('password-field');
  const e = document.getElementById('pw-eye');
  if (f.type === 'password') { f.type = 'text'; e.className = 'fas fa-eye-slash'; }
  else { f.type = 'password'; e.className = 'fas fa-eye'; }
}
// Init theme for auth page
document.addEventListener('DOMContentLoaded', () => { ThemeManager.init(); Toast.init(); });
</script>
{% endblock %}
